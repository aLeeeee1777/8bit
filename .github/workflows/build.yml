name: Build VST3

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build
      - name: Build
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: ChipSynth-VST3-Windows
          path: build/ChipSynth_artefacts/Release/VST3/ChipSynth.vst3
